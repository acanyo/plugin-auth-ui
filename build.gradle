plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'com.xhhao.authui'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.0')
    compileOnly 'run.halo.app:api'
    // Optional: tools for Halo MCP Server. Compile-time only; the server provides it at runtime.
    compileOnly 'run.halo.mcpserver:api:1.3.0'
    // Optional: the design studio's AI assistant uses Halo AI Foundation's models when it is enabled.
    compileOnly 'run.halo.aifoundation:api:1.3.0'

    testImplementation 'run.halo.app:api'
    testCompileOnly 'run.halo.mcpserver:api:1.3.0'
    testRuntimeOnly 'run.halo.mcpserver:api:1.3.0'
    testCompileOnly 'run.halo.aifoundation:api:1.3.0'
    testRuntimeOnly 'run.halo.aifoundation:api:1.3.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.27'
}

// The agent skill is kept in .agents/skills for local agents and served to site owners from
// /plugins/auth-ui/assets/mcp/skill/SKILL.md, so both always match.
tasks.named('processResources', ProcessResources) {
    from('.agents/skills/auth-ui-design/SKILL.md') {
        into 'mcp/skill'
    }
    // Apache-2.0 asks for the license and notices to travel with the distributed jar.
    from(fileTree(projectDir) { include 'LICENSE', 'NOTICE' }) {
        into 'META-INF'
    }
    from(layout.projectDirectory.dir('licenses')) {
        into 'META-INF/licenses'
    }
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}
